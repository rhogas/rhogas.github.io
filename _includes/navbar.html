<nav class="navbar navbar-expand-sm navbar-light fixed-top mb-5 shadow-sm">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <a class="navbar-brand" href="{{ '/' | relative_url }}"><strong>{{site.data.profile.navbar_name}}</strong></a>
        <button class="navbar-toggler" style="font-size: 1em; padding: 0.5em;" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fas fa-map"></i> Menu
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.name == page.navbar_title or include.active_page == item.name %}active{% endif %}">
                    <a class="nav-link" href="{{ item.url | relative_url }}" {% if item.new_tab %}target="_blank" rel="noopener noreferrer"{% endif %}> {{ item.name }}</a>
                </li>
                {% endfor %}
            </ul>
            <button id="theme-toggle" class="btn theme-toggle ml-2" type="button" title="Toggle dark mode" aria-label="Toggle dark mode"> <i class="fas fa-moon"></i></button>
        </div>
    </div>
</nav>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const root = document.documentElement;
    const button = document.getElementById("theme-toggle");
    const icon = button.querySelector("i");

    function applyTheme(theme) {
        root.setAttribute("data-theme", theme);
        icon.className = theme === "dark" ? "fas fa-sun" : "fas fa-moon";
        button.setAttribute("aria-pressed", theme === "dark");
    }

    const currentTheme = document.documentElement.getAttribute("data-theme");

    applyTheme(currentTheme);

    button.addEventListener("click", function () {
        const nextTheme = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        localStorage.setItem("theme", nextTheme);
        applyTheme(nextTheme);
    });
});
</script>
