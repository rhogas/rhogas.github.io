short_bio: >-
  Welcome! I’m Roberto, a final-year undergraduate student at <a href="https://purdue.edu" target="_blank">Purdue University</a>, on exchange from <a href="https://www.uc3m.es/home" target="_blank">University Carlos III of Madrid</a>.
  <p><p>
  My main research interests lie in the intersection of optimisation and machine learning techniques, with applications including decision-making under uncertainty and the design, verification and analysis of complex systems that can be abstracted as networks. Other topics of interest are theorical optimization of decision trees and graph query algorithms to improve modelization of large-scale decision problems.</p> 

  My past work involves the use of finite element methods, mixed-dimensional modelling and deep learning approaches, including physics-informed neural networks and neural operators, to accelerate physical flow simulations. I have also explored topics in numerical analysis, including the use of Faber polynomials to accelerate the convergence of the power iteration method in certain matrices in the complex plane.
  <p><p>
  When I am not doing research, I enjoy reading about political history and visiting new places around the world.

